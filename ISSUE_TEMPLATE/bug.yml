name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: Steps to reproduce and what you see
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Environment, page or endpoint
